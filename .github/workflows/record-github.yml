# Save real issues from public projects to the `recordings` branch, so the parser, the
# reproduction builder and the field test can be checked offline (scripts/record_github.py).
# Run by hand, or by editing this file.
name: Record GitHub issues

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/record-github.yml"]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python scripts/record_github.py corpus "$RUNNER_TEMP/out/issues.json.gz" \
            pallets/werkzeug pallets/click pallets/flask python-attrs/attrs python-poetry/tomlkit \
            psf/requests pytest-dev/pytest python/mypy expressjs/express axios/axios gin-gonic/gin BurntSushi/ripgrep
          python scripts/record_github.py fetch "$RUNNER_TEMP/out/fetch.json.gz"
      - name: Publish to the recordings branch
        run: |
          cd "$RUNNER_TEMP/out"
          git init --quiet -b recordings
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit --quiet -m "GitHub issues recorded by run ${GITHUB_RUN_ID}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" recordings
