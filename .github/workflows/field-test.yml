# Replays closed issues from public projects through the scout, in the Docker sandbox.
# Runs on every change to the tool and fails if a culprit it used to find is lost (fieldtest/golden.json).
# See fieldtest/field_test.py for how results are scored.
name: Field test

on:
  workflow_dispatch:
    inputs:
      issues:
        description: Closed issues to scan per project
        default: "300"
      ai:
        description: Use AI on reports with no runnable code (needs that provider's API key as a repository secret; costs money)
        type: choice
        options: ["off", anthropic, openai]
        default: "off"
      ai_model:
        description: Model name (blank for the provider's default)
        default: ""
      limit:
        description: Reports to replay per project
        default: "80"
  push:
    branches: [main]
    paths: ["src/**", "fieldtest/**", ".github/workflows/field-test.yml"]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { repo: pallets/click, deps: "" }
          - { repo: pallets/jinja, deps: "markupsafe" }
          - { repo: pallets/werkzeug, deps: "markupsafe" }
          - { repo: python-attrs/attrs, deps: "" }
          - { repo: marshmallow-code/marshmallow, deps: "packaging" }
          - { repo: Textualize/rich, deps: "markdown-it-py pygments" }
          - { repo: python-poetry/tomlkit, deps: "" }
          - { repo: pypa/packaging, deps: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Build an image that already holds the project's dependencies
        run: |
          printf 'FROM python:3.12-slim\nRUN pip install --no-cache-dir %s || true\n' "${{ matrix.deps }}" > "$RUNNER_TEMP/Dockerfile"
          docker build -q -t scout-field -f "$RUNNER_TEMP/Dockerfile" "$RUNNER_TEMP"
      - name: Fetch closed issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python fieldtest/field_test.py fetch "${{ matrix.repo }}" "$RUNNER_TEMP/issues.json" --issues "${{ inputs.issues || '300' }}" ${{ (inputs.ai == 'anthropic' || inputs.ai == 'openai') && '--prose' || '' }}
      # No GitHub token below this line: issue code runs here, inside a container with no network.
      # The AI key, when used, stays in the scout's own process and is never passed into the container.
      - name: Replay
        env:
          ANTHROPIC_API_KEY: ${{ inputs.ai == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENAI_API_KEY: ${{ inputs.ai == 'openai' && secrets.OPENAI_API_KEY || '' }}
          AI_MODEL: ${{ inputs.ai_model }}
        run: |
          status=0
          python fieldtest/field_test.py run target "$RUNNER_TEMP/issues.json" "$RUNNER_TEMP/out" --image scout-field \
            --limit "${{ inputs.limit || '80' }}" --ai "${{ inputs.ai || 'off' }}" --ai-model "$AI_MODEL" || status=$?
          cat "$RUNNER_TEMP/out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status  # non-zero when a culprit in fieldtest/golden.json was lost or changed
      - name: Artifact name
        if: always()
        run: echo "SAFE_NAME=$(echo '${{ matrix.repo }}' | tr '/' '-')" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-${{ env.SAFE_NAME }}
          path: ${{ runner.temp }}/out/
